/* AURAN Clinic — Modern Medical navigation redesign */
.app{grid-template-columns:264px minmax(0,1fr)}
.side{
  width:auto;
  padding:14px 12px 12px;
  display:flex;
  flex-direction:column;
  gap:0;
  overflow:hidden;
}
.brand{
  min-height:66px;
  padding:8px 9px 15px;
  margin-bottom:10px;
  border-bottom:1px solid var(--l);
  gap:11px;
}
.brand .mark,.brand-logo-img{width:40px;height:40px;min-width:40px;border-radius:13px}
.brand-copy{min-width:0;display:grid;gap:1px;line-height:1.1}
.brand-copy b{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-copy small{font-size:10px;letter-spacing:.01em}
.nav{
  flex:1;
  overflow-y:auto;
  overflow-x:hidden;
  padding:2px 3px 12px;
  scrollbar-width:thin;
}
.nav-section{margin:0 0 13px}
.nav-section-title{
  padding:7px 11px 6px;
  color:var(--m);
  font-size:9px;
  font-weight:800;
  letter-spacing:.12em;
  opacity:.86;
}
.nav button{
  position:relative;
  min-height:42px;
  width:100%;
  display:flex;
  align-items:center;
  gap:10px;
  margin:2px 0;
  padding:8px 10px;
  border-radius:11px;
  border:1px solid transparent;
  background:transparent;
  color:var(--m);
  font-size:12px;
  font-weight:550;
  box-shadow:none;
}
.nav button:hover{
  transform:none;
  background:#3b82f60c;
  color:var(--t);
  border-color:#3b82f614;
}
.nav button.on{
  background:#3b82f612;
  color:#60a5fa;
  border-color:#3b82f622;
  box-shadow:none;
}
.nav button.on:before{
  content:"";
  position:absolute;
  inset-block:8px;
  inset-inline-start:-4px;
  width:3px;
  border-radius:999px;
  background:linear-gradient(180deg,#38bdf8,#6366f1);
  box-shadow:0 0 12px #3b82f65c;
}
.nav-ico{
  width:30px!important;
  height:30px!important;
  min-width:30px;
  border-radius:9px!important;
  display:grid!important;
  place-items:center;
  color:inherit;
}
.nav button.on .nav-ico{background:#3b82f615!important}
.nav-label{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-count{
  margin-inline-start:auto;
  min-width:20px;
  height:20px;
  padding:0 6px;
  display:grid;
  place-items:center;
  border-radius:999px;
  background:#ef4444;
  color:#fff;
  font-size:10px;
  font-weight:800;
  box-shadow:0 4px 10px #ef444438;

v><button class="btn" data-a="changePassword">${t("تغيير","Change")}</button></div><div class="row"><div><b>${t("الجلسات النشطة","Active sessions")}</b><br><small class="muted">2 ${t("جلسات","sessions")}</small></div><button class="btn" data-a="manageSessions">${t("إدارة","Manage")}</button></div></div></div>`)}

function refreshEmployeeRolePicker(){let chips=document.getElementById("selectedRoleChips");if(chips)chips.innerHTML=S.selectedRoles.map(r=>`<span class="chip">${r}<button type="button" data-role-option="${r}" style="border:0;background:transparent;color:inherit">×</button></span>`).join("");document.querySelectorAll("#roleOptionList [data-role-option]").forEach(el=>{let on=S.selectedRoles.includes(el.dataset.roleOption),ck=el.querySelector(".check");if(ck){ck.classList.toggle("on",on);ck.textContent=on?"✓":""}})}

function openDelete(kind,id,label){S.modal="confirmDelete";S.modalPayload={kind,id,label};render()}
function performDelete(){let {kind,id,label}=S.modalPayload||{};if(kind==="patient"){S.patients=S.patients.filter(x=>x.id!==id);addAudit("PatientDeleted",id)}else if(kind==="employee"){S.employees=S.employees.filter(x=>x.id!==id);addAudit("UserDeleted",id)}else if(kind==="followup"){S.followups=S.followups.filter(x=>x.id!==id);addAudit("FollowUpDeleted",id)}else if(kind==="measurement"){S.measurements=S.measurements.filter(x=>x.id!==id);addAudit("MeasurementDeleted",id)}else if(kind==="role"){S.roles=S.roles.filter(x=>x.name!==id);S.employees.forEach(u=>u.roles=u.roles.filter(r=>r!==id));S.selectedRole=S.roles[0]?.name||"";addAudit("RoleDeleted",id)}else if(kind==="workflowState"){let i=+id,name=S.flow[i];S.flow.splice(i,1);S.transitions=S.transitions.filter(x=>x.from!==name&&x.to!==name);addAudit("WorkflowStateDeleted",name)}else if(kind==="transition"){S.transitions=S.transitions.filter(x=>x.id!==id);addAudit("WorkflowTransitionDeleted",id)}else if(kind==="medicalField"){S.medicalFields.splice(+id,1);addAudit("MedicalFieldDeleted",label)}else if(kind==="measurementType"){S.measurementTypes=S.measurementTypes.filter(x=>x.id!==id);addAudit("MeasurementTypeDeleted",id)}else if(kind==="queue"){let st=S.modalPayload.stage;S.q[st]=S.q[st].filter(x=>x!==id);addAudit("QueueEntryRemoved",id)}S.modal=null;S.modalPayload={};persistDemo();toast(t("تم الحذف من بيانات العرض","Deleted from demo data"));render()}
function saveModalData(){
 let k=S.modal,p=S.modalPayload||{};
 if(k==="patient"){let name=document.getElementById("mPatientName")?.value.trim(),phone=document.getElementById("mPatientPhone")?.value.trim(),dob=document.getElementById("mPatientDob")?.value,gender=document.getElementById("mPatientGender")?.value,status=document.getElementById("mPatientStatus")?.value;if(!name){toast(t("اكتب اسم المريض","Patient name is required"));return false}if(p.id){let x=patientById(p.id);x.name=name;x.nameEn=document.getElementById("mPatientNameEn")?.value.trim()||name;x.phone=phone;x.dob=dob;x.gender=gender;x.status=status;addAudit("PatientUpdated",x.id)}else{let id=nextId("P-",S.patients,5);S.patients.unshift({id,name,nameEn:document.getElementById("mPatientNameEn")?.value.trim()||name,phone,dob,gender,status});S.currentPatientId=id;addAudit("PatientCreated",id)}}
 else if(k==="employee"){let name=document.getElementById("mEmployeeName")?.value.trim(),email=document.getElementById("mEmployeeEmail")?.value.trim(),status=document.getElementById("mEmployeeStatus")?.value||"Active";if(!name||!email){toast(t("الاسم والبريد مطلوبان","Name and email are required"));return false}if(p.id){let x=S.employees.find(x=>x.id===p.id);Object.assign(x,{name,email,roles:[...S.selectedRoles],status});addAudit("UserUpdated",x.id)}else{let id="U-"+String(Math.max(0,...S.employees.map(x=>parseInt(x.id.replace(/\D/g,""))||0))+1).padStart(3,"0");S.employees.push({id,name,email,roles:[...S.selectedRoles],status});addAudit("UserCreated",id)}}
 else if(k==="arrival"){let pid=document.getElementById("mArrivalPatient")?.value,pt=patientById(pid),priority=document.getElementById("mArrivalPriority")?.value,doctor=document.getElementById("mArrivalDoctor")?.value;if(!pt)return false;if(!Object.values(S.q).flat().includes(pt.name))S.q.checked.push(pt.name);QM[pt.name]={id:pt.id,wait:"01m",doctor,room:"—",priority};addAudit("PatientCheckedIn",pt.id)}
 else if(k==="followup"){let pid=document.getElementById("mFollowPatient")?.value,title=document.getElementById("mFollowTitle")?.value.trim(),date=document.getElementById("mFollowDate")?.value,doctor=document.getElementById("mFollowDoctor")?.value,status=document.getElementById("mFollowStatus")?.value;if(!title||!date)return false;if(p.id){let x=S.followups.find(x=>x.id===p.id);Object.assign(x,{patientId:pid,titleAr:title,titleEn:title,date,doctor,status});addAudit("FollowUpUpdated",x.id)}else{let id=nextId("F-",S.followups,5);S.followups.unshift({id,patientId:pid,titleAr:title,titleEn:title,date,doctor,status});addAudit("FollowUpCreated",id)}}
 else if(k==="measurement"){let type=document.getElementById("mMeasureType")?.value.trim(),value=document.getElementById("mMeasureValue")?.value.trim(),unit=document.getElementById("mMeasureUnit")?.value.trim(),date=document.getElementById("mMeasureDate")?.value;if(!type||!value)return false;if(p.id){let x=S.measurements.find(x=>x.id===p.id);Object.assign(x,{type,value,unit,date});addAudit("MeasurementUpdated",x.id)}else{let id="M-"+String(Math.max(0,...S.measurements.map(x=>parseInt(x.id.replace(/\D/g,""))||0))+1).padStart(2,"0");S.measurements.unshift({id,type,value,unit,date});addAudit("MeasurementCreated",id)}}
 else if(k==="prescription"){let v=document.getElementById("mSimpleValue")?.value.trim();if(!v)return false;S.prescriptions.push(v);addAudit("PrescriptionCreated",S.currentVisitId)}
 else if(k==="clinicalOrder"){let v=document.getElementById("mSimpleValue")?.value.trim();if(!v)return false;S.clinicalOrders.push(v);addAudit("ClinicalOrderCreated",S.currentVisitId)}
 else if(k==="role"){let name=document.getElementById("mRoleName")?.value.trim(),desc=document.getElementById("mRoleDesc")?.value.trim();if(!name)return false;if(p.id){let x=S.roles.find(x=>x.name===p.id),old=x.name;x.name=name;x.description=desc;S.employees.forEach(u=>u.roles=u.roles.map(r=>r===old?name:r));S.selectedRole=name;addAudit("RoleUpdated",name)}else{if(S.roles.some(x=>x.name===name)){toast(t("اسم الدور موجود بالفعل","Role name already exists"));return false}S.roles.push({name,description:desc,permissions:[]});S.selectedRole=name;addAudit("RoleCreated",name)}}
 else if(k==="workflowState"){let name=document.getElementById("mWorkflowState")?.value.trim();if(!name)return false;if(p.index!==undefined&&p.index!==null){let old=S.flow[p.index];S.flow[p.index]=name;S.transitions.forEach(x=>{if(x.from===old)x.from=name;if(x.to===old)x.to=name});addAudit("WorkflowStateUpdated",name)}else{S.flow.splice(Math.max(1,S.flow.length-1),0,name);addAudit("WorkflowStateCreated",name)}}
 else if(k==="transition"){let from=document.getElementById("mTransitionFrom")?.value,to=document.getElementById("mTransitionTo")?.value,permission=document.getElementById("mTransitionPermission")?.value.trim();if(p.id){Object.assign(S.transitions.find(x=>x.id===p.id),{from,to,permission});addAudit("WorkflowTransitionUpdated",p.id)}else{let id="TR-"+(S.transitions.length+1);S.transitions.push({id,from,to,permission});addAudit("WorkflowTransitionCreated",id)}}
 else if(k==="medicalField"){let name=document.getElementById("mMedicalField")?.value.trim();if(!name)return false;if(p.index!==undefined)S.medicalFields[p.index]=name;else S.medicalFields.push(name);addAudit("MedicalFieldSaved",name)}
 else if(k==="measurementType"){let name=document.getElementById("mTypeName")?.value.trim(),code=document.getElementById("mTypeCode")?.value.trim(),unit=document.getElementById("mTypeUnit")?.value.trim(),valueType=document.getElementById("mTypeValueType")?.value;if(!name||!code)return false;if(p.id){Object.assign(S.measurementTypes.find(x=>x.id===p.id),{name,code,unit,valueType});addAudit("MeasurementTypeUpdated",p.id)}else{let id="MT-"+String(S.measurementTypes.length+1).padStart(2,"0");S.measurementTypes.push({id,name,code,unit,valueType,active:true});addAudit("MeasurementTypeCreated",id)}}
 else if(k==="counter"){let x=S.counters.find(x=>x.id===p.id);x.prefix=document.getElementById("mCounterPrefix")?.value;x.padding=+document.getElementById("mCounterPadding")?.value||x.padding;x.next=+document.getElementById("mCounterNext")?.value||x.next;addAudit("CounterUpdated",x.name)}
 else if(k==="clinic"){let name=document.getElementById("mClinicName")?.value.trim(),code=document.getElementById("mClinicCode")?.value.trim(),city=document.getElementById("mClinicCity")?.value.trim();if(!name||!code)return false;if(p.id){Object.assign(S.platformClinics.find(x=>x.id===p.id),{name,code,city});addPlatformAudit("ClinicUpdated",code,name)}else{let id="cln_demo_"+String(S.platformClinics.length+1).padStart(3,"0");S.platformClinics.push({id,code,name,status:"Active",city,created:new Date().toISOString().slice(0,10)});S.selectedClinicId=id;addPlatformAudit("ClinicCreated",code,name)}}
 else if(k==="password"){let a=document.getElementById("mPass1")?.value,b=document.getElementById("mPass2")?.value;if(!a||a!==b){toast(t("كلمتا المرور غير متطابقتين","Passwords do not match"));return false}addAudit("PasswordChanged","U-001")}
 else if(k==="forgotPassword"){addAudit("PasswordResetRequested",document.getElementById("mResetEmail")?.value||"")}
 else if(k==="completeVisit"){let x=S.visits.find(x=>x.id===S.currentVisitId);if(x){x.status="Completed";let pt=patientById(x.patientId),qn=pt?.name;if(qn){S.q.visit=S.q.visit.filter(n=>n!==qn);if(!S.q.done.includes(qn))S.q.done.push(qn)}}addAudit("VisitCompleted",S.currentVisitId);S.screen="follow";location.hash="/follow"}
 else if(k==="medical"){addAudit("MedicalProfileUpdated",S.currentPatientId)}
 else if(k==="workflowSettings"){S.workflowOptions={...(p.draft||S.workflowOptions)};addAudit("WorkflowSettingsUpdated","Primary")}
 S.modal=null;S.modalPayload={};persistDemo();toast(t("تم حفظ التغييرات","Changes saved"));render();return true

function audit(){
let all=S.auditEvents,
q=(S.listFilters.audit||"").toLowerCase(),
filtered=all.filter(r=>{
  let searchable=(r.join(" ")+" "+auditEventLabel(r[1])).toLowerCase();
  let filterOk=S.listFilters.auditEvent==="All"||r[1].toLowerCase().includes(S.listFilters.auditEvent.toLowerCase());
  return (!q||searchable.includes(q))&&filterOk;
}),
pg=pageData("audit",filtered),rows=pg.items;
return shell(
H(t("سجل التدقيق","Audit Log"),t("تتبع الأحداث الحساسة ومن قام بها باستخدام Correlation ID","Track sensitive activity, actors, and Correlation IDs"),`<div class="actions"><button class="btn" data-a="exportAudit">${ic("excel",14)}${t("تصدير CSV","Export CSV")}</button><button class="btn" data-a="clearAudit">${ic("refresh",14)}${t("إعادة بيانات العرض","Reset demo log")}</button></div>`)+
`<div class="grid s3"><div class="card status-card"><span class="icon-badge">${ic("audit",18)}</span><div><small class="muted">${t("إجمالي الأحداث","Total events")}</small><b style="display:block;font-size:24px">${all.length}</b></div></div><div class="card status-card"><span class="icon-badge">${ic("user",18)}</span><div><small class="muted">${t("منفذون مختلفون","Unique actors")}</small><b style="display:block;font-size:24px">${new Set(all.map(x=>x[3])).size}</b></div></div><div class="card status-card"><span class="icon-badge">${ic("activity",18)}</span><div><small class="muted">${t("معرّفات التتبع","Correlation IDs")}</small><b style="display:block;font-size:24px">${all.length}</b></div></div></div>
<div class="card top audit-card"><div class="screen-toolbar"><div class="permission-search-wrap">${ic("search",15)}<input id="auditSearch" class="input" value="${S.listFilters.audit||""}" placeholder="${t("ابحث في الحدث أو الكيان أو معرّف التتبع...","Search event, entity, or Correlation ID...")}"></div><select id="auditEventFilter" class="toolbar-select"><option value="All" ${S.listFilters.auditEvent==="All"?"selected":""}>${t("كل الأحداث","All events")}</option>${["Patient","Visit","User","Role"].map(v=>`<option value="${v}" ${S.listFilters.auditEvent===v?"selected":""}>${auditEntityTypeLabel(v)}</option>`).join("")}</select></div>
<div class="scroll"><table class="table"><thead><tr><th>${t("الوقت","Time")}</th><th>${t("الحدث","Event")}</th><th>${t("الكيان","Entity")}</th><th>${t("المنفذ","Actor")}</th><th>${t("معرّف التتبع","Correlation ID")}</th></tr></thead><tbody>${rows.map(r=>`<tr data-audit-row="${(r.join(" ")+" "+auditEventLabel(r[1])).toLowerCase()}" data-event="${r[1]}"><td dir="ltr">${r[0]}</td><td><span class="audit-event"><span class="activity-dot"></span><b>${auditEventLabel(r[1])}</b></span></td><td dir="ltr">${r[2]}</td><td>${r[3]}</td><td><code dir="ltr">${r[4]}</code></td></tr>`).join("")}</tbody></table></div>${pager("audit",pg)}</div>`
)}
