function audit(){let rows=S.auditEvents;return shell(H(t("سجل التدقيق","Audit Log"),t("تتبع الأحداث الحساسة وربطها بـ Correlation ID","Trace sensitive events with Correlation IDs"),`<div class="actions"><button class="btn" data-a="exportAudit">${ic("excel",14)}${t("تصدير CSV","Export CSV")}</button><button class="btn" data-a="clearAudit">${ic("refresh",14)}${t("إعادة بيانات العرض","Reset demo log")}</button></div>`)+`<div class="grid s3"><div class="card status-card"><span class="icon-badge">${ic("audit",18)}</span><div><small class="muted">${t("أحداث ظاهرة","Visible events")}</small><b style="display:block;font-size:24px">${rows.length}</b></div></div><div class="card status-card"><span class="icon-badge">${ic("user",18)}</span><div><small class="muted">${t("منفذون مختلفون","Unique actors")}</small><b style="display:block;font-size:24px">${new Set(rows.map(x=>x[3])).size}</b></div></div><div class="card status-card"><span class="icon-badge">${ic("activity",18)}</span><div><small class="muted">Correlation IDs</small><b style="display:block;font-size:24px">${rows.length}</b></div></div></div><div class="card top"><div class="screen-toolbar"><input id="auditSearch" class="input" placeholder="${t("بحث في الحدث أو الكيان أو Correlation ID...","Search event, entity or Correlation ID...")}"><select id="auditEventFilter" class="toolbar-select"><option value="All">${t("كل الأحداث","All events")}</option><option>Patient</option><option>Visit</option><option>User</option><option>Role</option></select></div><div class="scroll"><table class="table"><thead><tr><th>Time</th><th>Event</th><th>Entity</th><th>Actor</th><th>Correlation ID</th></tr></thead><tbody>${rows.map(r=>`<tr data-audit-row="${r.join(" ").toLowerCase()}" data-event="${r[1]}"><td dir="ltr">${r[0]}</td><td><span class="audit-event"><span class="activity-dot"></span><b>${r[1]}</b></span></td><td>${r[2]}</td><td>${r[3]}</td><td><code>${r[4]}</code></td></tr>`).join("")}</tbody></table></div></div>`)}
