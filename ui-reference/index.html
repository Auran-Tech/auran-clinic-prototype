function render(){save();let x={dashboard:dash,patients,patientProfile,queue,visits,clinical,follow,reports,employees,roles,settings,profile,audit,login}[S.screen]||dash;R.innerHTML=x()+modalHtml();dnd();let ps=document.getElementById("permSearch");if(ps)ps.oninput=()=>{let q=ps.value.toLowerCase();document.querySelectorAll("[data-permission]").forEach(el=>el.style.display=el.dataset.permission.includes(q)?"":"none")}}
document.addEventListener("click",e=>{let n=e.target.closest("[data-nav]");if(n){S.screen=n.dataset.nav;location.hash="/"+S.screen;render();return}let rr=e.target.closest("[data-r]");if(rr){S.report=rr.dataset.r;S.step=1;render();return}let tt=e.target.closest("[data-tab]");if(tt){S.tab=tt.dataset.tab;render();return}let pt=e.target.closest("[data-ptab]");if(pt){S.patientTab=pt.dataset.ptab;render();return}let pg=e.target.closest("[data-pgroup]");if(pg){S.roleGroup=pg.dataset.pgroup;render();return}let ro=e.target.closest("[data-role-option]");if(ro){let rr=ro.dataset.roleOption;S.selectedRoles=S.selectedRoles.includes(rr)?S.selectedRoles.filter(x=>x!==rr):[...S.selectedRoles,rr];render();return}let a=e.target.closest("[data-a]");if(!a)return;let q=a.dataset.a;if(q==="user")document.getElementById("pop")?.classList.toggle("hide");else if(q==="theme"){S.theme=S.theme==="dark"?"light":"dark";render()}else if(q==="lang"){S.lang=S.lang==="ar"?"en":"ar";render()}else if(q==="profile"){S.screen="profile";location.hash="/profile";render()}else if(q==="setAr"){S.lang="ar";render()}else if(q==="setEn"){S.lang="en";render()}else if(q==="logout"){S.screen="login";render()}else if(q==="login"){S.screen="dashboard";render()}else if(q==="patient"){S.screen="patientProfile";location.hash="/patientProfile";render()}else if(q==="clinical"){S.screen="clinical";location.hash="/clinical";render()}else if(q==="queueBoard"){S.queueView="board";render()}else if(q==="queueList"){S.queueView="list";render()}else if(q==="done"){S.screen="follow";render()}else if(q==="reportBack"){S.report=null;S.step=0;render()}else if(q==="preview"){S.step=2;render()}else if(["pdf","xls","refresh","save"].includes(q))alert(t("تم تنفيذ الإجراء في النموذج","Action executed in prototype"));else if(q==="sw")a.classList.toggle("on");else if(q==="newEmployee"||q==="editEmployee"){S.modal="employee";render()}else if(q==="modal"){S.modal="generic";render()}else if(q==="closeModal"){S.modal=null;render()}else if(q==="saveModal"){S.modal=null;toast(t("تم حفظ التغييرات","Changes saved"));render()}});
