<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Clinic Management V1 — Full Interactive Demo v3</title>
<style>
:root{
  --bg:#f5f7fb;--panel:#ffffff;--panel2:#fbfcff;--line:#e4e9f1;--text:#172033;--muted:#718096;
  --navy:#0f2340;--navy2:#18375e;--blue:#316df4;--blue2:#eaf1ff;--cyan:#34c5d8;
  --green:#18965d;--green2:#e8f8f0;--amber:#c68100;--amber2:#fff4d8;--red:#d34c4c;--red2:#fdeaea;
  --violet:#7458d8;--violet2:#efeafe;--shadow:0 18px 50px rgba(26,42,72,.10);--shadow2:0 9px 24px rgba(24,40,68,.07);
  --r:18px;--side:264px;--trans:180ms cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:"Aptos","Segoe UI Variable","Segoe UI",Tahoma,Arial,sans-serif;background:
radial-gradient(circle at 8% 0%,rgba(49,109,244,.08),transparent 26%),
radial-gradient(circle at 96% 18%,rgba(52,197,216,.08),transparent 24%),var(--bg);color:var(--text)}
button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}
.app{display:grid;grid-template-columns:var(--side) 1fr;min-height:100vh}
.sidebar{background:linear-gradient(180deg,#0e2039 0%,#112945 56%,#163656 100%);color:#fff;padding:18px 14px;position:sticky;top:0;height:100vh;overflow:auto;box-shadow:18px 0 50px rgba(15,35,64,.06);z-index:30}
.sidebar:before,.sidebar:after{display:none}
.brand{display:flex;gap:11px;align-items:center;padding:4px 8px 22px;position:relative}.brandmark{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,#4b7dff,#3fd4c1);display:grid;place-items:center;font-weight:950;box-shadow:0 10px 28px rgba(60,122,255,.28);transform:rotate(-4deg)}
.brand strong{display:block;letter-spacing:.08em;font-size:13px}.brand small{display:block;color:#9db1c9;font-size:10px;margin-top:2px}.sidetitle{font-size:9px;color:#7890ad;text-transform:uppercase;letter-spacing:.14em;padding:9px 10px 6px;font-weight:900}
.nav{display:grid;gap:6px;position:relative}.nav button{position:relative;border:0;background:transparent;color:#bfccdc;padding:10px 11px;border-radius:12px;text-align:left;display:flex;gap:10px;align-items:center;font-weight:750;transition:var(--trans)}
.nav button .ico{width:28px;height:28px;border-radius:9px;display:grid;place-items:center;background:rgba(255,255,255,.04);transition:var(--trans)}
.nav button:hover{background:rgba(255,255,255,.06);color:#fff;transform:translateX(2px)}.nav button.active{background:linear-gradient(90deg,rgba(58,111,236,.28),rgba(58,111,236,.11));color:#fff;box-shadow:inset 3px 0 0 #5e8cff}
.nav button.active .ico{background:#2f6fed;box-shadow:0 7px 18px rgba(47,111,237,.32);transform:translateY(-1px)}
.sidefoot{margin-top:20px;border:1px solid rgba(255,255,255,.09);background:rgba(255,255,255,.05);border-radius:15px;padding:12px;backdrop-filter:blur(6px);position:relative}.sidefoot small{display:block;color:#94abc5}.sidefoot b{display:block;margin:3px 0 2px}
.main{min-width:0}.topbar{height:82px;background:rgba(255,255,255,.90);border-bottom:1px solid rgba(228,233,241,.9);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:20;backdrop-filter:blur(14px)}
.eyebrow{font-size:10px;color:var(--blue);font-weight:950;letter-spacing:.12em;text-transform:uppercase;margin-bottom:4px}.topbar h1{margin:0;font-size:22px}.topactions{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.content{padding:22px;animation:pageIn .28s ease both;position:relative}.content:before{display:none}
@keyframes pageIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}@keyframes floaty{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-5px) rotate(2deg)}}@keyframes pop{0%{transform:scale(.98);opacity:.4}100%{transform:scale(1);opacity:1}}
.panel,.metric,.card{background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow2);transition:var(--trans)}.panel:hover,.metric:hover{box-shadow:var(--shadow)}.pad{padding:17px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.metric{padding:16px;position:relative;overflow:hidden}.metric:after{content:"";position:absolute;width:54px;height:54px;border-radius:16px;background:linear-gradient(135deg,rgba(49,109,244,.12),rgba(52,197,216,.06));right:-12px;top:-13px;transform:rotate(24deg)}
.metric span{font-size:11px;color:var(--muted);font-weight:750}.metric strong{font-size:27px;display:block;margin:5px 0}.metric small{color:var(--muted)}
.sectionhead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:14px}.sectionhead h2,.sectionhead h3{margin:0}.sectionhead p{margin:4px 0 0;color:var(--muted);font-size:12px}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.btn{border:0;border-radius:11px;height:39px;padding:0 13px;font-weight:850;display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:var(--trans)}
.btn:hover{transform:translateY(-1px);filter:brightness(1.02)}.btn:active{transform:translateY(0) scale(.99)}.btn.primary{background:var(--navy);color:#fff;box-shadow:0 8px 20px rgba(15,35,64,.14)}.btn.blue{background:linear-gradient(135deg,#316df4,#4b7fff);color:#fff;box-shadow:0 8px 20px rgba(49,109,244,.18)}.btn.secondary{background:#edf1f6}.btn.outline{background:#fff;border:1px solid var(--line)}.btn.success{background:var(--green2);color:#176c47}.btn.danger{background:var(--red2);color:#a52e2e}.btn.small{height:31px;font-size:11px;padding:0 9px}
.input,.select,.field input,.field select,.field textarea{border:1px solid var(--line);background:#fff;border-radius:11px;padding:9px 10px;outline:none;color:var(--text);transition:var(--trans)}.input:focus,.select:focus,.field input:focus,.field select:focus,.field textarea:focus{border-color:#a9c0ff;box-shadow:0 0 0 4px rgba(49,109,244,.08)}.input{height:41px;min-width:260px}
.field{display:grid;gap:6px}.field label{font-size:10px;color:var(--muted);font-weight:900;text-transform:uppercase;letter-spacing:.04em}.field textarea{min-height:84px;resize:vertical}.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}.formactions{display:flex;gap:8px;justify-content:flex-end;margin-top:13px}
.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse}th,td{padding:11px 9px;border-bottom:1px solid var(--line);text-align:left;font-size:12px;white-space:nowrap}th{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;background:#fbfcfe;position:sticky;top:0}tr:hover td{background:#fbfdff}
.status{display:inline-flex;padding:5px 8px;border-radius:999px;font-size:10px;font-weight:900}.blue{background:var(--blue2);color:#2253b8}.green{background:var(--green2);color:#176743}.amber{background:var(--amber2);color:#916000}.red{background:var(--red2);color:#9f3030}.gray{background:#edf1f6;color:#5e6978}.violet{background:var(--violet2);color:#5f46ba}
.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}.tab{height:34px;border:1px solid var(--line);background:#fff;border-radius:999px;padding:0 11px;font-weight:800;font-size:11px;color:var(--muted);transition:var(--trans)}.tab:hover{transform:translateY(-1px)}.tab.active{background:var(--navy);color:#fff;border-color:var(--navy);box-shadow:0 7px 18px rgba(15,35,64,.14)}
.card{padding:13px}.card:hover{transform:translateY(-1px)}.divider{height:1px;background:var(--line);margin:13px 0}.muted{color:var(--muted)}.small{font-size:11px}.empty{text-align:center;color:var(--muted);padding:30px}
.profilehead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:14px}.profilehead h2{margin:7px 0 3px}.profilehead p{margin:0;color:var(--muted)}
.suggestions{border:1px solid var(--line);border-radius:13px;overflow:auto;background:#fff;max-height:320px;box-shadow:var(--shadow2)}.suggestion{padding:11px 12px;border-bottom:1px solid var(--line);transition:var(--trans)}.suggestion:hover{background:#f6f9ff;padding-left:15px}
.queueboard{display:grid;grid-template-columns:repeat(4,minmax(220px,1fr));gap:11px;overflow:auto}.qcol{background:linear-gradient(180deg,#f9fbfe,#f4f7fb);border:1px solid var(--line);border-radius:15px;padding:10px;min-height:410px}.qcol h3{font-size:12px;margin:0 0 9px;display:flex;justify-content:space-between}.pcard{background:#fff;border:1px solid var(--line);border-radius:13px;padding:11px;margin-bottom:9px;box-shadow:0 6px 16px rgba(20,38,63,.05);animation:pop .18s ease both}.pcard:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(20,38,63,.09)}.pcard .actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.modalback{position:fixed;inset:0;background:rgba(10,20,35,.52);z-index:100;display:grid;place-items:center;padding:16px;animation:pop .16s ease both}.modal{width:min(740px,96vw);max-height:90vh;overflow:auto;background:#fff;border-radius:20px;padding:18px;box-shadow:0 34px 90px rgba(0,0,0,.26)}.modal.large{width:min(1040px,96vw)}.modalhead{display:flex;justify-content:space-between;gap:10px;margin-bottom:14px}.modalhead h3{margin:0}.iconbtn{width:35px;height:35px;border:1px solid var(--line);background:#fff;border-radius:10px}
.toastroot{position:fixed;right:18px;bottom:18px;display:grid;gap:7px;z-index:130}.toast{background:#10233f;color:#fff;padding:11px 13px;border-radius:11px;box-shadow:0 18px 45px rgba(0,0,0,.18);animation:pop .18s ease both}
.builder{display:grid;gap:8px}.builderrow{border:1px solid var(--line);border-radius:12px;padding:11px;display:flex;justify-content:space-between;gap:10px;align-items:center;background:#fff}.switch{width:42px;height:23px;border-radius:999px;background:#cfd7e3;position:relative;transition:var(--trans)}.switch:after{content:"";position:absolute;top:3px;left:3px;width:17px;height:17px;border-radius:50%;background:#fff;transition:var(--trans)}.switch.on{background:var(--blue)}.switch.on:after{left:22px}
.chip{display:inline-flex;padding:5px 8px;border-radius:999px;background:#eef3fb;font-size:10px;margin:2px}.quickgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.quick{border:1px solid var(--line);background:linear-gradient(180deg,#fff,#fbfdff);border-radius:13px;padding:13px;text-align:left;transition:var(--trans)}.quick:hover{background:#f8fbff;border-color:#bdd0ff;transform:translateY(-2px)}
.timeline{display:grid;gap:9px}.trow{display:grid;grid-template-columns:95px 12px 1fr;gap:9px}.dot{width:9px;height:9px;border-radius:50%;background:var(--blue);margin-top:5px;box-shadow:0 0 0 5px rgba(49,109,244,.08)}.banner{padding:11px 12px;border-radius:12px;background:var(--amber2);border:1px solid #ffe2a2;color:#865a00;margin-bottom:11px}.rxsec{border:1px solid var(--line);border-radius:13px;padding:12px;margin-bottom:10px;background:#fff}.rxsec h3{margin:0 0 9px}.auto{position:relative}.autolist{position:absolute;left:0;right:0;top:100%;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);z-index:10;max-height:170px;overflow:auto}.autoitem{padding:8px 9px;border-bottom:1px solid var(--line)}.autoitem:hover{background:#f6f9ff}
.kpirow{display:flex;gap:8px;flex-wrap:wrap}.kpi{padding:8px 10px;background:#f6f8fc;border-radius:10px;font-size:11px}.permgroup{border:1px solid var(--line);border-radius:15px;overflow:hidden;background:#fff}.permgroup h3{margin:0;padding:12px 13px;background:#f8faff;border-bottom:1px solid var(--line);font-size:13px}.permrow{display:grid;grid-template-columns:1.6fr repeat(4,90px);gap:8px;padding:10px 12px;border-bottom:1px solid var(--line);align-items:center}.permrow:last-child{border-bottom:0}.permname b{display:block}.permname small{color:var(--muted);display:block;margin-top:2px}.check{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;margin:auto;background:#edf1f6;color:#8b96a8;font-weight:900}.check.y{background:var(--green2);color:var(--green)}
.rolecard{display:flex;align-items:center;gap:9px}.rolebadge{width:36px;height:36px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(135deg,#edf2ff,#eefbf9);font-weight:900;color:var(--blue)}
.fieldtype{font-size:10px;padding:5px 7px;border-radius:999px;background:#f0f3f8;color:#586579}.filepreview{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:9px}.thumb{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}.thumb img{width:100%;height:105px;object-fit:cover;display:block}.thumb div{padding:8px}.logoPreview{width:82px;height:82px;border-radius:18px;border:1px dashed #b9c7db;background:#f8fbff;display:grid;place-items:center;overflow:hidden}.logoPreview img{width:100%;height:100%;object-fit:cover}
@media(max-width:1150px){:root{--side:88px}.brand>div:last-child,.sidetitle,.nav span:last-child,.sidefoot{display:none}.brand,.nav button{justify-content:center}.grid4{grid-template-columns:repeat(2,1fr)}.permrow{grid-template-columns:1.5fr repeat(4,70px)}}
@media(max-width:840px){.grid4,.grid3,.grid2,.formgrid{grid-template-columns:1fr}.content{padding:14px}.input{min-width:0;width:100%}.permrow{grid-template-columns:1fr;gap:4px}.permrow>div:not(.permname){display:inline-flex;margin-right:4px}}
@media(max-width:680px){.app{display:block}.sidebar{position:fixed;left:0;right:0;bottom:0;top:auto;height:64px;z-index:50;padding:6px}.brand,.sidetitle,.sidefoot{display:none}.nav{display:flex;justify-content:flex-start;overflow:auto}.nav button{padding:8px;min-width:58px}.main{padding-bottom:70px}.topbar{height:auto;min-height:72px;padding:10px 12px}}

/* v4 — quieter shapes, richer icon-led UI */
.hero-strip{background:linear-gradient(110deg,#10233f,#173b67 62%,#23568c);color:#fff;border-radius:18px;padding:18px 20px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero-strip:after{content:"";position:absolute;left:0;bottom:0;width:100%;height:3px;background:linear-gradient(90deg,#54d2c0,#6a96ff,#54d2c0);background-size:200% 100%;animation:lineMove 5s linear infinite}
@keyframes lineMove{to{background-position:200% 0}}
.hero-strip h2{margin:0 0 5px;font-size:21px}.hero-strip p{margin:0;color:#c6d6ea;font-size:12px}.hero-actions{display:flex;gap:8px;margin-top:13px;flex-wrap:wrap}
.hero-btn{border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.09);color:#fff;border-radius:10px;padding:9px 11px;font-weight:800;transition:var(--trans)}
.hero-btn:hover{background:rgba(255,255,255,.15);transform:translateY(-1px)}
.statline{display:flex;gap:10px;align-items:center}.stat-icon{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:#eef3ff;color:#275ed0;font-size:17px}
.metric{border-radius:14px}.metric:after{display:none}.metric:hover{transform:translateY(-2px)}
.metric .trend{font-size:10px;color:var(--green);font-weight:800;margin-top:3px}
.section-icon{width:32px;height:32px;border-radius:9px;background:#eef3ff;color:#2e63d9;display:grid;place-items:center;margin-right:8px}
.section-title-row{display:flex;align-items:center}
.activity-row{display:grid;grid-template-columns:42px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.activity-row:last-child{border-bottom:0}.activity-icon{width:36px;height:36px;border-radius:10px;background:#f0f4fb;display:grid;place-items:center;font-size:16px}
.progress-track{height:7px;background:#edf1f6;border-radius:999px;overflow:hidden}.progress-fill{height:100%;background:linear-gradient(90deg,#316df4,#44cbb8);border-radius:999px;animation:growBar .5s ease both}
@keyframes growBar{from{width:0}}
.dashboard-list{display:grid;gap:8px}.dashboard-list .row{display:grid;grid-template-columns:1fr auto;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.report-layout{display:grid;grid-template-columns:300px 1fr;gap:14px}
.report-list{display:grid;gap:8px}.report-item{border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px;display:grid;grid-template-columns:38px 1fr;gap:10px;text-align:left;transition:var(--trans)}
.report-item:hover{border-color:#bfd0f7;transform:translateX(2px)}.report-item.active{border-color:#8fb0ff;background:#f7f9ff;box-shadow:inset 3px 0 0 var(--blue)}
.report-icon{width:36px;height:36px;border-radius:10px;background:#edf3ff;color:#2c62d8;display:grid;place-items:center;font-size:17px}.report-item b{display:block}.report-item small{color:var(--muted);display:block;margin-top:2px;line-height:1.35}
.report-builder{min-height:520px}.filterbar{display:grid;grid-template-columns:repeat(3,minmax(140px,1fr));gap:10px;padding:13px;background:#f8fafc;border:1px solid var(--line);border-radius:13px;margin-bottom:13px}
.preview-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}.preview-meta{font-size:11px;color:var(--muted)}
.exportbar{display:flex;gap:8px;flex-wrap:wrap}.report-empty{padding:60px 20px;text-align:center;color:var(--muted)}.report-empty .bigicon{font-size:34px;margin-bottom:8px}
.role-layout{display:grid;grid-template-columns:280px 1fr;gap:14px}.role-list{display:grid;gap:8px}.role-option{border:1px solid var(--line);background:#fff;border-radius:12px;padding:11px;display:grid;grid-template-columns:38px 1fr auto;gap:9px;align-items:center;text-align:left;transition:var(--trans)}
.role-option:hover{border-color:#bfd0f7}.role-option.active{border-color:#8fb0ff;background:#f6f9ff;box-shadow:inset 3px 0 0 var(--blue)}
.permission-card{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;padding:11px 12px;border-bottom:1px solid var(--line)}
.permission-card:last-child{border-bottom:0}.perm-ico{width:32px;height:32px;border-radius:9px;background:#edf8f2;color:#168557;display:grid;place-items:center;font-weight:900}
.permission-card .code{font-size:9px;color:#99a4b4;margin-top:3px}
.duplicate-box{border:1px solid #f2cf7c;background:#fff9e8;border-radius:12px;padding:11px;margin-top:10px}.duplicate-box.danger{border-color:#f0a4a4;background:#fff0f0}.duplicate-title{display:flex;gap:8px;align-items:center;font-weight:900}
.duplicate-person{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid rgba(120,100,50,.12);margin-top:7px}.duplicate-person:first-of-type{border-top:0}
.qsummary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}.qsummary .qs{background:#fff;border:1px solid var(--line);border-radius:12px;padding:11px;display:flex;gap:9px;align-items:center}.qsicon{width:34px;height:34px;border-radius:9px;background:#eef3ff;color:#2d62d7;display:grid;place-items:center}
.pcard{position:relative;overflow:hidden}.pcard:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:#cad5e7}.qmeta{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}.qmeta div{background:#f8fafc;border-radius:8px;padding:6px}.qmeta span{display:block;font-size:9px;color:var(--muted);text-transform:uppercase}.qmeta b{font-size:11px}
.next-step{margin-top:8px;padding:7px 8px;border-radius:9px;background:#f4f7fb;font-size:10px;color:#526071}.pcard .status{margin-top:7px}
.page-section-head{display:flex;align-items:center;gap:9px}.page-section-head .pi{width:34px;height:34px;border-radius:10px;background:#edf3ff;color:#2b62d8;display:grid;place-items:center}
@media(max-width:1050px){.report-layout,.role-layout{grid-template-columns:1fr}.report-list,.role-list{grid-template-columns:repeat(2,1fr)}.filterbar{grid-template-columns:repeat(2,1fr)}.qsummary{grid-template-columns:repeat(2,1fr)}}
@media(max-width:680px){.report-list,.role-list,.filterbar,.qsummary{grid-template-columns:1fr}}


/* v5 — Configuration & Settings redesign */
.config-shell{display:grid;grid-template-columns:240px 1fr;gap:14px}
.config-nav{background:#fff;border:1px solid var(--line);border-radius:16px;padding:10px;box-shadow:var(--shadow2);height:max-content;position:sticky;top:98px}
.config-nav button{width:100%;border:0;background:transparent;border-radius:11px;padding:11px 10px;display:grid;grid-template-columns:34px 1fr auto;gap:9px;align-items:center;text-align:left;color:var(--text);transition:var(--trans)}
.config-nav button:hover{background:#f7f9fc}.config-nav button.active{background:#eef4ff;color:#2456bc;box-shadow:inset 3px 0 0 var(--blue)}
.config-nav .navico{width:32px;height:32px;border-radius:9px;background:#f0f4fb;display:grid;place-items:center}
.config-nav button.active .navico{background:#dce8ff;color:#2456bc}
.config-nav b{display:block}.config-nav small{display:block;color:var(--muted);margin-top:1px}
.config-main{display:grid;gap:14px}
.config-hero{background:linear-gradient(120deg,#f8fbff,#ffffff 52%,#f7fbff);border:1px solid #dfe7f2;border-radius:16px;padding:16px;display:flex;justify-content:space-between;gap:12px;align-items:center}
.config-hero .copy h2{margin:0}.config-hero .copy p{margin:5px 0 0;color:var(--muted);font-size:12px}.config-hero .heroico{width:48px;height:48px;border-radius:14px;background:#edf3ff;color:#2d62d8;display:grid;place-items:center;font-size:22px}
.config-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow2)}

function patientDuplicateMatches(name,phone){
 const n=(name||"").trim().toLowerCase(),ph=(phone||"").replace(/\s+/g,"");
 return db.patients.map(p=>{
   const pn=p.name.toLowerCase(),pp=p.phone.replace(/\s+/g,"");
   let score=0,reasons=[];
   if(ph&&pp===ph){score=100;reasons.push("Same phone number")}
   else if(ph&&ph.length>=5&&(pp.includes(ph)||ph.includes(pp))){score=Math.max(score,75);reasons.push("Similar phone number")}
   if(n&&pn===n){score=Math.max(score,90);reasons.push("Same full name")}
   else if(n.length>=4&&(pn.includes(n)||n.includes(pn))){score=Math.max(score,65);reasons.push("Similar name")}
   const nt=n.split(/\s+/).filter(x=>x.length>2),pt=pn.split(/\s+/);const shared=nt.filter(x=>pt.includes(x)).length;
   if(shared>=2){score=Math.max(score,70);reasons.push("Matching name parts")}
   return {p,score,reasons:[...new Set(reasons)]};
 }).filter(x=>x.score>=60).sort((a,b)=>b.score-a.score);
}
function renderDuplicateCheck(){
 const box=$("#dupcheck");if(!box)return;const name=$("#npn").value,phone=$("#npp").value,matches=patientDuplicateMatches(name,phone);
 const exactPhone=matches.some(x=>x.score===100&&x.reasons.includes("Same phone number"));
 if(!matches.length){box.innerHTML=name||phone?'<div class="duplicate-box"><div class="duplicate-title">✓ No strong duplicate found</div><div class="small muted" style="margin-top:4px">The system is checking the patient database while you type.</div></div>':"";$("#savenp").disabled=false;$("#savenp").style.opacity="1";return}
 box.innerHTML=`<div class="duplicate-box ${exactPhone?"danger":""}"><div class="duplicate-title">${exactPhone?"⚠ Existing phone number detected":"⚠ Possible existing patient"}</div><div class="small muted" style="margin-top:4px">${exactPhone?"Registration is blocked until you open or correct the existing patient.":"Review the matches before creating another patient."}</div>${matches.slice(0,4).map(x=>`<div class="duplicate-person"><div><b>${x.p.name}</b><div class="small muted">${x.p.number} · ${x.p.phone}</div><div class="small">${x.reasons.join(" · ")}</div></div><button class="btn outline small" data-dupopen="${x.p.id}">Open Patient</button></div>`).join("")}</div>`;
 $("#savenp").disabled=exactPhone;$("#savenp").style.opacity=exactPhone?".45":"1";
 $$("[data-dupopen]").forEach(b=>b.onclick=()=>{$("#modal").innerHTML="";state.patientId=b.dataset.dupopen;state.ptab="Overview";render()});
}

function qcard(q){

function employees(){return `<div class="panel pad"><div class="sectionhead"><div><h2>Employees & Roles</h2><p>One user may have multiple protected system roles</p></div><button class="btn primary" id="adde">+ Add Employee</button></div><div class="tablewrap"><table><thead><tr><th>Name</th><th>Email</th><th>Assigned Roles</th><th>Status</th><th>Protection</th><th></th></tr></thead><tbody>${db.users.map(u=>`<tr><td><b>${u.name}</b></td><td>${u.email||"—"}</td><td>${u.roles.map(r=>`<span class="chip">${roleLabel(r)}</span>`).join("")}</td><td>${u.active?"Active":"Disabled"}</td><td>${u.roles.includes("SUPER_USER")?"Protected Super User":"—"}</td><td>${u.roles.includes("SUPER_USER")?"":`<button class="btn outline small" data-edite="${u.id}">Edit</button>`}</td></tr>`).join("")}</tbody></table></div></div>`}
function bindEmployees(){$("#adde").onclick=()=>employeeModal();$$("[data-edite]").forEach(b=>b.onclick=()=>employeeModal(b.dataset.edite))}
function employeeModal(userid=null){const u=userid?db.users.find(x=>x.id===userid):null;modal(u?"Edit Employee":"Add Employee",`<div class="formgrid"><div class="field"><label>Name</label><input id="en" value="${u?.name||""}"></div><div class="field"><label>Email</label><input id="ee" value="${u?.email||""}"></div></div><div class="divider"></div><div class="field"><label>Assign Roles</label><div class="grid2">${db.roles.map(r=>`<label class="card rolecard"><input type="checkbox" name="rolecb" value="${r.code}" ${u?.roles.includes(r.code)?"checked":""}><span class="rolebadge">${ROLE_META[r.code].icon}</span><span><b>${ROLE_META[r.code].name}</b><small class="muted" style="display:block">${ROLE_META[r.code].desc}</small></span></label>`).join("")}</div></div><div class="field" style="margin-top:10px"><label>Status</label><select id="es"><option value="1" ${!u||u.active?"selected":""}>Active</option><option value="0" ${u&&!u.active?"selected":""}>Disabled</option></select></div><div class="formactions"><button class="btn primary" id="savee">Save Employee</button></div>`,true);$("#savee").onclick=()=>{const name=$("#en").value.trim(),roles=$$('input[name="rolecb"]:checked').map(x=>x.value);if(!name||!roles.length)return toast("Name and at least one role required");if(u){u.name=name;u.email=$("#ee").value;u.roles=roles;u.active=$("#es").value==="1";audit("Updated employee",u.name)}else{db.users.push({id:uid("u"),name,email:$("#ee").value,roles,active:$("#es").value==="1"});audit("Created employee",name)}save();$("#modal").innerHTML="";render();toast("Employee saved")}}

    <div class="card" style="margin-top:12px"><div class="rolecard"><span class="rolebadge">★</span><div><b>Super User</b><div class="small muted">All permissions automatically. Protected from normal administration.</div></div></div></div>
  </div>
  <div class="panel pad"><div class="sectionhead"><div class="page-section-head"><span class="pi">${ROLE_META[selected.code].icon}</span><div><h2>${ROLE_META[selected.code].name}</h2><p>${ROLE_META[selected.code].desc}</p></div></div><span class="status blue">${selected.permissions.length} permissions · Read-only</span></div>
    ${groups.map(g=>`<div class="permgroup" style="margin-bottom:12px"><h3>${g}</h3>${PERMISSIONS.filter(p=>p.group===g&&granted.has(p.code)).map(p=>`<div class="permission-card"><span class="perm-ico">✓</span><div><b>${p.label}</b><div class="small muted">${p.desc}</div><div class="code">${p.code}</div></div><span class="status green">Granted</span></div>`).join("")}</div>`).join("")}

 </div>`;

function statusColor(c){const map={blue:"#316df4",green:"#22a06b",amber:"#d29216",red:"#d34c4c",gray:"#8995a7",violet:"#7458d8",cyan:"#2bb8ca"};return map[c]||c||"#316df4"}function statusColorSoft(c){const h=statusColor(c).replace("#","");if(h.length!==6)return"#eef3ff";const r=parseInt(h.slice(0,2),16),g=parseInt(h.slice(2,4),16),b=parseInt(h.slice(4,6),16);return`rgba(${r},${g},${b},.12)`}function workflowMapHtml(){const nodes=db.workflow.slice().sort((a,b)=>a.order-b.order),W=980,H=Math.max(360,Math.ceil(nodes.length/4)*150+50),pos={};nodes.forEach((n,i)=>{pos[n.code]={x:35+(i%4)*235,y:35+Math.floor(i/4)*145}});const edges=db.transitions.filter(t=>pos[t.from]&&pos[t.to]);const svg=`<svg class="wf-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#a8b5c6"/></marker></defs>${edges.map(e=>{const a=pos[e.from],b=pos[e.to],x1=a.x+168,y1=a.y+43,x2=b.x,y2=b.y+43,mid=(x1+x2)/2;return`<path d="M ${x1} ${y1} C ${mid} ${y1}, ${mid} ${y2}, ${x2} ${y2}" fill="none" stroke="#a8b5c6" stroke-width="2" marker-end="url(#arr)"/>`}).join("")}</svg>`;return `<div class="wf-map" style="min-height:${H}px">${svg}${nodes.map(n=>{const p=pos[n.code],outs=db.transitions.filter(t=>t.from===n.code).length;return`<div class="wf-map-node" style="left:${p.x}px;top:${p.y}px;--c:${statusColor(n.color)}"><b><span class="color"></span>${n.name}</b><div class="code">${n.code}</div><div class="out">${outs} outgoing transition${outs===1?"":"s"}</div></div>`}).join("")}</div>`}
function workflowCfg(){const ordered=db.workflow.slice().sort((a,b)=>a.order-b.order);return `${configHero("⚡","Clinic Workflow","Every status and transition updates the 2D preview immediately. Colors are fully customizable.",'<button class="btn primary" id="addws">+ Add Status</button><button class="btn outline" id="addtr">+ Add Transition</button>')}<div class="workflow-stage"><div class="config-card-head"><div><h3>2D Workflow Preview</h3><p>Generated directly from actual statuses and transitions.</p></div><span class="status blue">${ordered.length} stages · ${db.transitions.length} transitions</span></div>${workflowMapHtml()}</div><div class="config-card"><div class="config-card-head"><div><h3>Status Configuration</h3><p>Use any color you want. Changes update the preview immediately.</p></div></div><div class="builder">${ordered.map((w,i)=>`<div class="config-status-row"><span class="status-color-dot" style="--dot:${statusColor(w.color)}"></span><div><b>${i+1}. ${w.name}</b><div class="small muted">${w.code}</div></div><span class="fieldtype">${w.color}</span><button class="btn outline small" data-editcolor="${w.id}">Change Color</button></div>`).join("")}</div></div><div class="config-card"><div class="config-card-head"><div><h3>Allowed Transitions</h3><p>Connections are drawn in the 2D preview above.</p></div></div><div class="builder">${db.transitions.map((t,i)=>`<div class="builderrow"><div class="meta"><span class="itemico">→</span><div><b>${wf(t.from).name}</b><small>moves to ${wf(t.to).name}</small></div></div><button class="btn danger small" data-deltr="${i}">Remove</button></div>`).join("")}</div></div>`}

function workflowStatusModal(){modal("Add Workflow Status",`<div class="formgrid"><div class="field"><label>Status Name</label><input id="ws-name" placeholder="e.g. Waiting For Test"></div><div class="field"><label>Status Color</label><div class="color-input-row"><input id="ws-color" type="color" value="#316df4"><input id="ws-hex" value="#316df4" placeholder="#316df4"></div><div class="setting-help">Choose any color — not a fixed palette.</div></div></div><div class="formactions"><button class="btn primary" id="savews">Add Status</button></div>`);$("#ws-color").oninput=e=>$("#ws-hex").value=e.target.value;$("#ws-hex").oninput=e=>{if(/^#[0-9a-fA-F]{6}$/.test(e.target.value))$("#ws-color").value=e.target.value};$("#savews").onclick=()=>{const n=$("#ws-name").value.trim();if(!n)return toast("Status name required");const code=n.toUpperCase().replace(/[^A-Z0-9]+/g,"_");if(db.workflow.some(w=>w.code===code))return toast("A status with this code already exists");const color=/^#[0-9a-fA-F]{6}$/.test($("#ws-hex").value)?$("#ws-hex").value:$("#ws-color").value;db.workflow.push({id:uid("w"),code,name:n,color,order:db.workflow.length+1});save();audit("Added workflow status",n);$("#modal").innerHTML="";render();toast("Workflow status added")}}
function workflowTransitionModal(){

 $("#savetr").onclick=()=>{const from=$("#trf").value,to=$("#trt").value;if(from===to)return toast("From and To cannot be the same");if(db.transitions.some(t=>t.from===from&&t.to===to))return toast("This transition already exists");db.transitions.push({from,to});save();audit("Added workflow transition",`${from} -> ${to}`);$("#modal").innerHTML="";render();toast("Transition added successfully")}

function addProfileFieldModal(){const types=["text","textarea","number","boolean","date","image","file","single-select","multi-select"];modal("Add Dynamic Patient Profile Field",`<div class="formgrid"><div class="field"><label>Section</label><select id="pfs">${db.profileSections.filter(s=>!s.system||["Medical Profile"].includes(s.name)).map(s=>`<option>${s.name}</option>`).join("")}</select></div><div class="field"><label>Field Label</label><input id="pfl"></div><div class="field"><label>Field Type</label><select id="pft">${types.map(t=>`<option>${t}</option>`).join("")}</select></div><div class="field"><label>Required</label><select id="pfr"><option value="0">No</option><option value="1">Yes</option></select></div></div><div class="field" style="margin-top:10px"><label>Options (comma separated, for select types)</label><input id="pfo"></div><div class="formactions"><button class="btn primary" id="savepf">Add Field</button></div>`);$("#savepf").onclick=()=>{const label=$("#pfl").value.trim();if(!label)return toast("Field label required");db.customProfileFields.push({id:uid("pf"),section:$("#pfs").value,label,type:$("#pft").value,required:$("#pfr").value==="1",options:$("#pfo").value.split(",").map(x=>x.trim()).filter(Boolean)});save();audit("Added dynamic profile field",label);$("#modal").innerHTML="";render();toast("Profile field added")}}
function addClinicalFieldModal(){const types=["text","number","boolean","single-select","multi-select"];modal("Add Clinical Measurement Field",`<div class="formgrid"><div class="field"><label>Name</label><input id="cfn"></div><div class="field"><label>Type</label><select id="cft">${types.map(t=>`<option>${t}</option>`).join("")}</select></div><div class="field"><label>Unit</label><input id="cfu"></div><div class="field"><label>Options</label><input id="cfo" placeholder="For select types"></div></div><div class="formactions"><button class="btn primary" id="savecf">Add</button></div>`);$("#savecf").onclick=()=>{const n=$("#cfn").value.trim();if(!n)return;db.clinicalFields.push({id:uid("cf"),name:n,type:$("#cft").value,unit:$("#cfu").value,enabled:true,options:$("#cfo").value.split(",").map(x=>x.trim()).filter(Boolean)});save();audit("Added clinical field",n);$("#modal").innerHTML="";render();toast("Clinical field added")}}

  {icon:"♙",title:"Employees",summary:"Clinic users and assigned roles.",why:"One user can have multiple roles such as Doctor + Admin.",flow:["Create or edit employee","Assign one or multiple roles","Enable or disable account"],note:"Super User remains protected from ordinary administration."},
  {icon:"⌘",title:"Roles & Permissions",summary:"Protected system roles with readable permissions.",why:"Permissions determine sidebar visibility and available actions.",flow:["Select role","Review grouped permissions","Understand resulting access"],note:"System role permissions are read-only in V1."},
  {icon:"⚙",title:"Configuration",summary:"Make the system fit different clinic types.",why:"Workflow, patient profile, clinical measurements and prescription sections are configurable.",flow:["Configure statuses and transitions","Add dynamic patient fields","Enable specialty measurements","Configure prescription/order sections"],note:"The workflow diagram and colors are generated from the same configuration used by the Live Queue."},
  {icon:"⚲",title:"Settings",summary:"Clinic identity and operating defaults.",why:"Controls clinic-specific branding, welcome content, timezone, locale and document defaults.",flow:["Set clinic identity","Set timezone and locale","Edit post-login welcome message","Set reminders and prescription defaults"],note:"The login screen belongs to AURAN Technology; the welcome screen after sign-in belongs to the clinic."},
  {icon:"≡",title:"Audit",summary:"Trace important changes.",why:"Provides accountability across clinical and administrative actions.",flow:["Review actor","Review action","Review entity and time"],note:"Useful for troubleshooting and reviewing configuration changes."}
 ];
 return `<div class="help-layout">
  <aside class="help-nav"><div class="sectionhead"><div><h3>System Guide</h3><p>Detailed product map</p></div></div>${sections.map((s,i)=>`<button data-help-anchor="help-${i}">${s.icon} ${s.title}</button>`).join("")}</aside>
  <section class="help-content"><div class="help-section"><div class="page-section-head"><span class="pi">?</span><div><h2>Clinic Management V1 Guide</h2><p>This page explains what every major area does, why it exists, and the normal workflow users should follow during a demo or real clinic operation.</p></div></div></div>
  ${sections.map((s,i)=>`<div class="help-section" id="help-${i}"><div class="help-feature"><span class="help-ico">${s.icon}</span><div><h2>${s.title}</h2><p><b>${s.summary}</b> ${s.why}</p><div class="guide-flow">${s.flow.map((x,n)=>`<div class="guide-step"><span class="num">${n+1}</span><b>${x}</b><small>${n===0?"Start here.":n===s.flow.length-1?"Normal end of this flow.":"Continue to the next step."}</small></div>`).join("")}</div><div class="guide-note">${s.note}</div></div></div></div>`).join("")}</section>
 </div>`;
}
function bindHelp(){$$("[data-help-anchor]").forEach(b=>b.onclick=()=>document.getElementById(b.dataset.helpAnchor)?.scrollIntoView({behavior:"smooth",block:"start"}))}
function auditView(){return `<div class="panel pad"><div class="sectionhead"><div><h2>Audit Log</h2><p>Important clinical, operational and administrative actions</p></div></div><div class="tablewrap"><table><thead><tr><th>Time</th><th>Actor</th><th>Action</th><th>Entity</th></tr></thead><tbody>${db.audit.map(a=>`<tr><td>${fmt(a.at)}</td><td>${a.actor}</td><td>${a.action}</td><td>${a.entity}</td></tr>`).join("")}</tbody></table></div></div>`}
render();
</script>
</body>
</html>
